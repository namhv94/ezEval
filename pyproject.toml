[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ezeval"
version = "0.1.0"
description = "High-throughput boundary fuzzing, JSON Schema enforcement, and safety guardrails for AI agents & LLMs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "EzLabs Team", email = "contact@ezlabs.tech" }
]
keywords = ["evals", "fuzzing", "guardrails", "json-schema", "safety", "ai-agents", "ezlabs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://ezlabs.tech"
Repository = "https://github.com/namhv94/ezEval"
"Bug Tracker" = "https://github.com/namhv94/ezEval/issues"

[project.scripts]
ezeval = "ezeval.cli:main"
